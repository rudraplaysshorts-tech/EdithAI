<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E.D.I.T.H. Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main class="section"><div class="section-head"><span>PRIVATE ADMIN</span><h2>E.D.I.T.H. Release Center</h2><p>Upload the latest signed APK, archive old releases and review paid orders. This panel requires the server-side admin token.</p></div><div class="trial-card" style="display:block"><input id="token" placeholder="Admin token" style="width:100%;padding:14px;border-radius:12px;border:1px solid #332b45;background:#0b0a10;color:white;margin-bottom:12px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><input id="version" placeholder="Version e.g. 1.2.0" style="padding:14px;border-radius:12px;border:1px solid #332b45;background:#0b0a10;color:white"><input id="price" type="number" value="59" placeholder="Price" style="padding:14px;border-radius:12px;border:1px solid #332b45;background:#0b0a10;color:white"></div><textarea id="notes" placeholder="Release notes" style="width:100%;min-height:110px;padding:14px;border-radius:12px;border:1px solid #332b45;background:#0b0a10;color:white;margin:12px 0"></textarea><input id="apkurl" placeholder="APK direct download URL (e.g. GitHub Release asset link)" style="width:100%;padding:14px;border-radius:12px;border:1px solid #332b45;background:#0b0a10;color:white;margin:10px 0"><input id="filename" placeholder="File name e.g. edith-1.2.0.apk (optional)" style="width:100%;padding:14px;border-radius:12px;border:1px solid #332b45;background:#0b0a10;color:white;margin-bottom:18px"><button class="buy" onclick="uploadRelease()">Publish APK Release</button><p id="msg" style="color:#8f8999">APK file host karo GitHub Releases par (free, no card), phir uska direct download link yahaan daalo.</p></div><div class="section" style="padding:55px 0 0"><h3>Recent releases</h3><div id="releases"></div></div></main><script>const $=id=>document.getElementById(id);async function uploadRelease(){const apk_url=$('apkurl').value.trim();if(!apk_url)return $('msg').textContent='APK URL daalo.';$('msg').textContent='Publishing…';const r=await fetch('/api/admin/releases',{method:'POST',headers:{'x-admin-token':$('token').value,'content-type':'application/json'},body:JSON.stringify({version:$('version').value,price:$('price').value,notes:$('notes').value,apk_url,file_name:$('filename').value})});const d=await r.json();$('msg').textContent=r.ok?'Published successfully.':'Error: '+(d.error||'publish failed');load();}async function load(){const r=await fetch('/api/admin/releases',{headers:{'x-admin-token':$('token').value}});if(!r.ok)return;const d=await r.json();$('releases').innerHTML=d.releases.map(x=>`<div class="plan" style="margin:10px 0"><b>${x.version}</b> · ${x.status} · ₹${x.price}<p>${x.notes||''}</p></div>`).join('')} </script></body></html>
