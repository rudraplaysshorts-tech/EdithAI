name = "edithai"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "edith-store"
database_id = "397680f9-0151-4035-a539-3803aa53ecab"

[vars]
# Secrets: RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, ADMIN_TOKEN
# Optional (free): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID — set both to get instant order/payment alerts with the customer's phone number
